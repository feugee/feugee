services:
  mailpit:
    image: axllent/mailpit:v1.31.2
    container_name: feugee-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  postgres:
    image: postgres:18-alpine
    container_name: feugee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feugee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feugee}
      POSTGRES_DB: ${POSTGRES_DB:-feugee}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - feugee-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feugee} -d ${POSTGRES_DB:-feugee}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  feugee-postgres:
