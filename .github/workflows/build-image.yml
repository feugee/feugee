name: Build release image

# Builds the standalone container image and publishes it to GHCR, so the
# target VPS never runs `next build` itself (a 2 GB machine thrashes on it).
# Pushing to main (or a manual dispatch) releases ghcr.io/feugee/feugee:latest.
#
# Build-time DATABASE_URL: the Dockerfile's builder stage migrates and
# prerenders against a database, so the job stands up a throwaway Postgres
# service. RUN steps execute in a build container on the default Docker
# bridge — the runner is reachable at its gateway, 172.17.0.1. Prerendering
# sees an empty (but fully migrated) database; the runtime seed writes via
# the Payload Local API, which fires the revalidate hooks and repopulates
# the served pages on first boot.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: build
          POSTGRES_PASSWORD: build
          POSTGRES_DB: build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U build"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      # No setup-buildx here: the default (docker driver) builder keeps RUN
      # steps on the runner's bridge network, where 172.17.0.1 reaches the
      # Postgres service above.
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The env schema (src/env.ts) validates at config load during the
      # build, so every missing value fails loudly and early. Email is
      # exactly-one-of: only the configured transport is passed.
      - name: Compose build args
        id: args
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
        run: |
          if [ -z "$NEXT_PUBLIC_SERVER_URL" ]; then
            echo "::error::NEXT_PUBLIC_SERVER_URL repo variable is not set"
            exit 1
          fi
          {
            echo 'args<<BUILD_ARGS_EOF'
            echo "DATABASE_URL=postgres://build:build@172.17.0.1:5432/build"
            echo "PAYLOAD_SECRET=$PAYLOAD_SECRET"
            echo "NEXT_PUBLIC_SERVER_URL=$NEXT_PUBLIC_SERVER_URL"
            echo "R2_BUCKET=$R2_BUCKET"
            echo "R2_ACCOUNT_ID=$R2_ACCOUNT_ID"
            echo "R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID"
            echo "R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY"
            if [ -n "$RESEND_API_KEY" ]; then
              echo "RESEND_API_KEY=$RESEND_API_KEY"
            fi
            if [ -n "$SMTP_HOST" ]; then
              echo "SMTP_HOST=$SMTP_HOST"
              echo "SMTP_PORT=$SMTP_PORT"
              if [ -n "$SMTP_USER" ]; then
                echo "SMTP_USER=$SMTP_USER"
                echo "SMTP_PASS=$SMTP_PASS"
              fi
            fi
            echo "EMAIL_FROM_ADDRESS=$EMAIL_FROM_ADDRESS"
            echo "EMAIL_FROM_NAME=$EMAIL_FROM_NAME"
            echo 'BUILD_ARGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ steps.args.outputs.args }}
